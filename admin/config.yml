backend:
  name: git-gateway
  repo: your-github-username/your-repo-name # Update this to your repo!
  branch: main # Or master, depending on your default branch

# Where to save uploaded images
media_folder: "assets/uploads" 
public_folder: "/assets/uploads"

# Define your content structures here
collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "content/blog"
    create: true
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Body", name: "body", widget: "markdown"}

  # --- NEW: Photos Collection for CMS ---
  - name: "photos"
    label: "Photo Gallery"
    folder: "content/photos"
    create: true
    identifier_field: "caption"
    fields:
      - {label: "Photo Caption", name: "caption", widget: "string"}
      - {label: "Upload Image", name: "image", widget: "image"} # This opens an upload button!
      - {label: "Date Taken", name: "date", widget: "datetime"}

